name: cicd-iam-test
on: push

jobs:
  image-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Debug OIDC Token Sub
      run: |
        # OIDC ID 토큰을 요청하여 JWT payload를 디코딩해 sub 출력
        ACTIONS_ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
        echo "==== ACTUAL SUB VALUE ===="
        echo $(echo $ACTIONS_ID_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub')
        echo "=========================="

    - name: Configure AWS Credentials
      id: credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::045510281556:role/githib-actions
        aws-region: ap-northeast-2
    
    - name: Test aws credential1
      run: |
        aws s3 ls
        